<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>배포 점검 · 서울사회복지사의 밤</title>
<style>
  :root{color-scheme:light dark;--bg:#f6f7f5;--fg:#1b2420;--mut:#66736d;--card:#fff;--line:#dfe4e0;--ok:#1f8a4c;--bad:#c2412e;--warn:#b07a00}
  @media (prefers-color-scheme:dark){:root{--bg:#0b1513;--fg:#e8efeb;--mut:#90a39b;--card:#13211e;--line:#24352f}}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,'Pretendard','Noto Sans KR',system-ui,sans-serif;font-size:15px;line-height:1.6}
  main{max-width:720px;margin:0 auto;padding:28px 18px 60px}
  h1{font-size:21px;margin:0 0 4px}
  p.lead{margin:0 0 22px;color:var(--mut)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden}
  .row{display:grid;grid-template-columns:22px 1fr;gap:10px;padding:12px 14px;border-top:1px solid var(--line)}
  .row:first-child{border-top:none}
  .ic{font-weight:700}
  .ok .ic{color:var(--ok)} .bad .ic{color:var(--bad)} .warn .ic{color:var(--warn)}
  .row b{display:block}
  .row span{color:var(--mut);font-size:13.5px;word-break:break-all}
  h2{font-size:14px;color:var(--mut);margin:22px 2px 8px;font-weight:600;letter-spacing:.02em}
  .verdict{border-radius:12px;padding:16px 18px;margin-top:18px;font-weight:600}
  .verdict.ok{background:rgba(31,138,76,.12);color:var(--ok)}
  .verdict.bad{background:rgba(194,65,46,.12);color:var(--bad)}
  video{width:100%;border-radius:10px;background:#000;margin-top:10px}
  button{font:inherit;padding:10px 16px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
</style>
</head>
<body>
<main>
  <h1>배포 점검</h1>
  <p class="lead">이 화면을 그대로 캡처해서 보내주시면 원인을 바로 알 수 있습니다.</p>

  <h2>페이지 · 설정</h2>
  <div class="card" id="site"></div>

  <h2>영상 파일</h2>
  <div class="card" id="files"></div>

  <h2>이 브라우저의 재생 능력</h2>
  <div class="card" id="browser"></div>

  <div id="verdict"></div>

  <h2>직접 재생 시험</h2>
  <div class="card" style="padding:14px">
    <button id="try" type="button">▶ 소리 없이 재생해 보기</button>
    <video id="v" controls muted playsinline preload="metadata">
      <source src="/assets/video.webm" type="video/webm">
      <source src="/assets/video.mp4" type="video/mp4">
    </video>
    <div id="vstate" style="margin-top:8px;color:var(--mut);font-size:13.5px"></div>
  </div>
</main>
<script>
const row = (box, state, title, detail) => {
  const ic = state === 'ok' ? '✓' : state === 'bad' ? '✕' : '!';
  box.insertAdjacentHTML('beforeend',
    `<div class="row ${state}"><div class="ic">${ic}</div><div><b>${title}</b><span>${detail || ''}</span></div></div>`);
};
const kb = n => n ? (n/1024/1024).toFixed(2) + ' MB' : '-';
const problems = [];

async function head(url){
  try{
    const r = await fetch(url, { method:'GET', headers:{ Range:'bytes=0-1023' }, cache:'no-store' });
    const total = (r.headers.get('content-range') || '').split('/')[1] || r.headers.get('content-length');
    return { status:r.status, type:r.headers.get('content-type') || '', size:+total || 0,
             range: r.status === 206 };
  }catch(e){ return { status:0, err:e.message }; }
}

(async () => {
  // 1) index.html 버전
  const site = document.getElementById('site');
  try{
    const html = await (await fetch('/', { cache:'no-store' })).text();
    const m = html.match(/sw-night r(\d+)/);
    const ver = m ? +m[1] : 0;
    if (ver >= 10) row(site,'ok', `index.html 최신 버전 (r${ver})`, '');
    else { row(site,'bad', ver ? `index.html 이전 버전 (r${ver})` : 'index.html 버전 표식 없음 (아주 오래된 파일)',
             '새 index.html 로 통째로 교체해야 합니다'); problems.push('index.html 이 최신이 아닙니다 → 교체'); }
    const usesSource = /<source src="\/assets\/video\.(webm|mp4)"/.test(html);
    if (!usesSource) problems.push('index.html 이 영상 파일을 예전 방식으로 부르고 있습니다 → 교체');
  }catch(e){ row(site,'bad','index.html 을 읽지 못함', e.message); }

  // 2) config.js
  try{
    const r = await fetch('/config.js', { cache:'no-store' });
    if (r.status !== 200) { row(site,'bad','config.js 없음', `HTTP ${r.status}`); problems.push('config.js 가 없습니다'); }
    else {
      const t = await r.text();
      const has = /SUPABASE_URL:\s*'https:\/\/[^']+'/.test(t) && /SUPABASE_ANON_KEY:\s*'[^']{20,}'/.test(t);
      row(site, has ? 'ok' : 'warn', has ? 'config.js 키 입력됨' : 'config.js 는 있지만 키가 비어 있음', has ? '' : '신청 폼 대신 "설정 확인 필요"가 뜹니다');
    }
  }catch(e){ row(site,'bad','config.js 확인 실패', e.message); }

  // 3) 영상 파일
  const files = document.getElementById('files');
  const res = {};
  for (const [f, mime] of [['video.mp4','video/mp4'], ['video.webm','video/webm']]){
    const r = res[f] = await head('/assets/' + f);
    if (r.status === 200 || r.status === 206){
      const typeOk = r.type.startsWith(mime);
      const sizeOk = r.size > 200 * 1024;
      const st = typeOk && sizeOk ? 'ok' : 'bad';
      row(files, st, `/assets/${f} 있음`,
        `HTTP ${r.status} · ${r.type || '형식 없음'} · ${kb(r.size)} · 구간 요청 ${r.range ? '지원' : '미지원'}`);
      if (!typeOk) problems.push(`${f} 의 형식이 ${r.type} 로 내려옵니다 (정상: ${mime})`);
      if (!sizeOk) problems.push(`${f} 크기가 ${kb(r.size)} 로 비정상입니다 → 업로드가 잘못됐을 수 있음 (Git LFS 포인터 파일 의심)`);
    } else {
      row(files,'bad', `/assets/${f} 없음`, r.status ? `HTTP ${r.status}` : r.err);
    }
  }
  const mp4ok = [200,206].includes(res['video.mp4'].status), webmok = [200,206].includes(res['video.webm'].status);
  if (!mp4ok && !webmok) problems.push('영상 파일이 서버에 없습니다 → 저장소의 assets 폴더에 video.mp4 와 video.webm 을 올리세요');

  // 4) 브라우저
  const b = document.getElementById('browser');
  const v = document.createElement('video');
  const h264 = v.canPlayType('video/mp4; codecs="avc1.4D401F, mp4a.40.2"');
  const vp9  = v.canPlayType('video/webm; codecs="vp9, opus"');
  row(b, h264 ? 'ok':'warn', `MP4 (H.264) 재생: ${h264 || '불가'}`, '');
  row(b, vp9  ? 'ok':'warn', `WebM (VP9) 재생: ${vp9 || '불가'}`, '');
  if (!h264 && !vp9) problems.push('이 브라우저는 두 형식 모두 재생하지 못합니다');
  const conn = navigator.connection;
  if (conn && conn.saveData) { row(b,'warn','데이터 절약 모드 켜짐','자동재생이 막힙니다. 재생 버튼을 눌러야 합니다'); }
  row(b,'ok', navigator.userAgent.replace(/\s+/g,' ').slice(0,140), '');

  // 5) 판정
  const vd = document.getElementById('verdict');
  vd.innerHTML = problems.length
    ? `<div class="verdict bad">확인된 문제<br>· ${problems.join('<br>· ')}</div>`
    : `<div class="verdict ok">파일·서버·브라우저 모두 정상입니다. 페이지에서 영상이 멈춰 있다면 자동재생이 막힌 것이니 가운데 ▶ 버튼을 누르면 재생됩니다. 아래 직접 재생 시험으로도 확인해 보세요.</div>`;
})();

// 직접 재생
const V = document.getElementById('v'), S = document.getElementById('vstate');
const say = t => S.textContent = t;
V.addEventListener('loadedmetadata', () => say(`불러옴: ${V.currentSrc.split('/').pop()} · ${V.videoWidth}×${V.videoHeight} · ${V.duration.toFixed(1)}초`));
V.addEventListener('playing', () => say(`재생 중: ${V.currentSrc.split('/').pop()}`));
V.addEventListener('error', () => say(`오류 코드 ${V.error && V.error.code}`));
V.querySelectorAll('source').forEach(s => s.addEventListener('error', () => {
  if (V.networkState === 3) say('두 파일 모두 불러오지 못했습니다 (파일 없음 또는 형식 오류)');
}));
document.getElementById('try').onclick = () => V.play().catch(e => say('재생 실패: ' + e.name + ' — ' + e.message));
</script>
</body>
</html>
